name: CI Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # dggrid4py never ran in CI on Windows before, see #20
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        environment: [dggrid844, dggrid91]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}-${{ matrix.environment }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: ${{ matrix.environment }}
          # no pixi.lock in the repository, every run solves against current conda-forge
          cache: false

      - name: Run tests
        run: pixi run -e ${{ matrix.environment }} test
